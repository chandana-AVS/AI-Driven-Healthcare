services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthcare_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/healthcare_assistant
    ports:
      - "8000:8000"
    volumes:
      - documents:/app/storage/medical_documents
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  documents:
